name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build + test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4  # plugin tests + jni.h for plugin support
        with:
          distribution: temurin
          java-version: '25'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev python3
      - run: ./build.sh test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/*.log
            build/logs/
            build/stress/*.log

  compile:
    name: Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 2
